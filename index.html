<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio - Sección YouTube</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: #121212;
      color: #ffffff;
      padding: 40px 20px;
    }

    /* Contenedor Principal de la Sección */
    .youtube-section {
      max-width: 1000px;
      margin: 0 auto;
    }

    .youtube-section h2 {
      font-size: 1.8rem;
      margin-bottom: 24px;
      text-align: center;
    }

    /* Grilla de YouTube (2 Columnas) */
    .youtube-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-bottom: 24px;
    }

    .youtube-card {
      cursor: pointer;
      border-radius: 12px;
      overflow: hidden;
      background: #1a1a1a;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .youtube-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }

    .thumbnail-container {
      position: relative;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background-color: #000;
    }

    .thumbnail-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .play-icon {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      font-size: 20px;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.3s ease, transform 0.3s ease;
    }

    .youtube-card:hover .play-icon {
      background: #ff0000;
      transform: translate(-50%, -50%) scale(1.1);
    }

    .youtube-card h3 {
      padding: 14px 16px;
      font-size: 0.95rem;
      color: #ffffff;
      margin: 0;
    }

    /* Ocultar los videos adicionales inicialmente */
    .youtube-card.hidden {
      display: none;
    }

    /* Botón Ver Más / Ver Menos */
    .btn-ver-mas {
      display: block;
      margin: 0 auto;
      padding: 12px 28px;
      background-color: #2b2b2b;
      color: #ffffff;
      border: 1px solid #444;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: background-color 0.2s ease;
    }

    .btn-ver-mas:hover {
      background-color: #3d3d3d;
    }

    /* Ventana Emergente (Modal) */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(5px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      position: relative;
      width: 90%;
      max-width: 960px; /* Tamaño grande para la reproducción */
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }

    .close-modal {
      position: absolute;
      top: 10px;
      right: 18px;
      color: #fff;
      font-size: 32px;
      font-weight: bold;
      cursor: pointer;
      z-index: 1010;
      line-height: 1;
    }

    .iframe-container {
      position: relative;
      padding-bottom: 56.25%; /* Relación de aspecto 16:9 */
      height: 0;
    }

    .iframe-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    /* Adaptación a dispositivos móviles */
    @media (max-width: 640px) {
      .youtube-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- SECCIÓN DE YOUTUBE -->
  <section class="youtube-section">
    <h2>Trabajos en YouTube</h2>

    <div class="youtube-grid">
      <!-- Video 1 (Visible) -->
      <div class="youtube-card" data-video-id="ID_DEL_VIDEO_1">
        <div class="thumbnail-container">
          <img src="https://img.youtube.com/vi/ID_DEL_VIDEO_1/maxresdefault.jpg" alt="Título del video 1">
          <div class="play-icon">▶</div>
        </div>
        <h3>Título del Video 1</h3>
      </div>

      <!-- Video 2 (Visible) -->
      <div class="youtube-card" data-video-id="ID_DEL_VIDEO_2">
        <div class="thumbnail-container">
          <img src="https://img.youtube.com/vi/ID_DEL_VIDEO_2/maxresdefault.jpg" alt="Título del video 2">
          <div class="play-icon">▶</div>
        </div>
        <h3>Título del Video 2</h3>
      </div>

      <!-- Video 3 (Oculto inicialmente) -->
      <div class="youtube-card extra-video hidden" data-video-id="ID_DEL_VIDEO_3">
        <div class="thumbnail-container">
          <img src="https://img.youtube.com/vi/ID_DEL_VIDEO_3/maxresdefault.jpg" alt="Título del video 3">
          <div class="play-icon">▶</div>
        </div>
        <h3>Título del Video 3</h3>
      </div>

      <!-- Video 4 (Oculto inicialmente) -->
      <div class="youtube-card extra-video hidden" data-video-id="ID_DEL_VIDEO_4">
        <div class="thumbnail-container">
          <img src="https://img.youtube.com/vi/ID_DEL_VIDEO_4/maxresdefault.jpg" alt="Título del video 4">
          <div class="play-icon">▶</div>
        </div>
        <h3>Título del Video 4</h3>
      </div>
    </div>

    <button id="toggle-yt-btn" class="btn-ver-mas">Ver más</button>
  </section>

  <!-- VENTANA EMERGENTE (MODAL PLAYER) -->
  <div id="video-modal" class="modal">
    <div class="modal-content">
      <span class="close-modal">&times;</span>
      <div class="iframe-container">
        <iframe id="youtube-player" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
      </div>
    </div>
  </div>

  <!-- LÓGICA JAVASCRIPT -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // 1. Control del botón "Ver más / Ver menos"
      const toggleBtn = document.getElementById('toggle-yt-btn');
      const extraVideos = document.querySelectorAll('.extra-video');

      toggleBtn.addEventListener('click', () => {
        const isHidden = extraVideos[0].classList.contains('hidden');
        
        extraVideos.forEach(video => {
          video.classList.toggle('hidden');
        });

        toggleBtn.textContent = isHidden ? 'Ver menos' : 'Ver más';
      });

      // 2. Control del Reproductor Emergente (Modal)
      const modal = document.getElementById('video-modal');
      const player = document.getElementById('youtube-player');
      const closeModalBtn = document.querySelector('.close-modal');
      const ytCards = document.querySelectorAll('.youtube-card');

      // Abrir ventana emergente y reproducir video en grande
      ytCards.forEach(card => {
        card.addEventListener('click', () => {
          const videoId = card.getAttribute('data-video-id');
          if (videoId) {
            player.src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
            modal.classList.add('active');
          }
        });
      });

      // Función para cerrar la ventana emergente y detener la reproducción
      const closeModal = () => {
        modal.classList.remove('active');
        player.src = '';
      };

      closeModalBtn.addEventListener('click', closeModal);

      // Cerrar al hacer clic fuera de la ventana
      modal.addEventListener('click', (e) => {
        if (e.target === modal) {
          closeModal();
        }
      });

      // Cerrar con la tecla ESC
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && modal.classList.contains('active')) {
          closeModal();
        }
      });
    });
  </script>
</body>
</html>
