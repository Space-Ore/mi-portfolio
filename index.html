<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Jorge Sánchez</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f0f0f;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            text-align: center;
            margin-bottom: 40px;
        }
        h1 {
            margin: 10px 0;
            font-size: 2.5rem;
        }
        p {
            color: #aaa;
            font-size: 1.1rem;
        }
        .section-title {
            font-size: 1.8rem;
            margin-top: 40px;
            margin-bottom: 20px;
            border-bottom: 2px solid #333;
            width: 100%;
            max-width: 1200px;
            padding-bottom: 10px;
        }
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1200px;
        }
        .video-card {
            background: #1f1f1f;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .video-container {
            position: relative;
            width: 100%;
            padding-top: 177.77%; /* Proporción 9:16 para Shorts/Reels */
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        .video-info {
            padding: 15px;
            font-size: 1rem;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <header>
        <h1>Jorge Sánchez</h1>
        <p>Video Editor & Videographer Portfolio</p>
    </header>

    <div class="section-title">Reels & Shorts</div>
    
    <div class="video-grid">
        <!-- Video 1: Spud's Coffee -->
        <div class="video-card">
            <div class="video-container">
                <iframe 
                    src="https://www.youtube.com/embed/-FphNx9YwDw?rel=0" 
                    title="Spud's Coffee" 
                    referrerpolicy="strict-origin-when-cross-origin"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen>
                </iframe>
            </div>
            <div class="video-info">Spud's Coffee</div>
        </div>

        <!-- Video 2: Reel / Short 1 -->
        <div class="video-card">
            <div class="video-container">
                <iframe 
                    src="https://www.youtube.com/embed/xHPL-PKVTRc?rel=0" 
                    title="YouTube Short 1" 
                    referrerpolicy="strict-origin-when-cross-origin"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen>
                </iframe>
            </div>
            <div class="video-info">Clip 01</div>
        </div>

        <!-- Video 3: Reel / Short 2 -->
        <div class="video-card">

                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"

            <div class="video-info">Clip 02</div>
        </div>

        <!-- Video 4: Reel / Short 3 -->
        <div class="video-card">

                <iframe 
                    src="https://www.youtube.com/embed/WxSb3z5eLcc?rel=0" 
                    title="YouTube Short 3" 
                    referrerpolicy="strict-origin-when-cross-origin"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen>
                </iframe>
            </div>
            <div class="video-info">Clip 03</div>
        </div>

        <!-- Video 5: Reel / Short 4 -->
        <div class="video-card">
            <div class="video-container">
                <iframe 
                    src="https://www.youtube.com/embed/qHSvPspj6nw?rel=0" 
                    title="YouTube Short 4" 
                    referrerpolicy="strict-origin-when-cross-origin"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen>
                </iframe>
            </div>
            <div class="video-info">Clip 04</div>
        </div>

        <!-- Video 6: Reel / Short 5 -->
        <div class="video-card">
            <div class="video-container">
                <iframe 
                    src="https://www.youtube.com/embed/DfGPSDcxy6k?rel=0"

                    referrerpolicy="strict-origin-when-cross-origin"

                    allowfullscreen>

            <div class="video-info">Clip 05</div>

    </div>

</body>
</html>
